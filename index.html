<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="relative bg-[url('images/people.jpg')] bg-center bg-cover min-h-screen">
    <div class="absolute inset-0 bg-black bg-opacity-70 z-0"></div>
    <div class="relative z-10 text-white">
        <h1 class="text-7xl text-center pt-20  ">People Entered</h1>
    <h2 class="text-4xl text-center" id="count-el">0</h2>
    <div class="flex justify-center space-x-5">
        <button class="border-1 p-2 w-[120px] border-black text-black bg-yellow-300 rounded-2xl justify-center " id="increment-btn"
            onclick="increment()">INCREMENT</button>
        <button class="border-1 p-3 w-[100px] text-black border-black bg-blue-300 rounded-2xl justify-center" id="save-btn"
            onclick="save()">SAVE</button>
    </div>
    <p id="welcome-el"></p>
    <p class="text-center pt-5 text-3xl" id="save-el">Previous Entries:</p>
    <div class="flex justify-center pt-5">
        <button class="border-1 bg-red-500 p-5 rounded-2xl  " id="total-el" onclick="total()">Total count</button>
    </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
